# <summary>
# Space LCD settings: the template install.sh copies to ~/.config/space-lcd/config.ini on
# first install and never overwrites.
# </summary>
# <remarks>
# The control panel edits the copy for you, and the service picks up any change within a
# couple of seconds, so there is no need to restart anything. A value it cannot read is
# reported in the journal and the last good settings stay in use; at start, the defaults.
# Keys are matched with case ignored; "=" and ":" both work. No value interpolation: a
# "%" in a path is just a "%". Nothing here is secret.
# </remarks>

[display]
# Which cooler's screen to drive: auto finds it by its USB IDs (an NZXT Kraken 2023 if one
# is plugged in, otherwise the ID-COOLING SPACE), or name it: space or kraken2023.
cooler = auto

# AUTO finds the screen by its USB IDs and wakes it. Set a path such as /dev/ttyACM1
# only if AUTO picks the wrong device.
com_port = AUTO

# Backlight, 0 to 100.
brightness = 40

# Turns the picture to match how the pump head is mounted: 0, 90, 180 or 270.
rotation = 0

# Seconds between updates. Minimum 0.5.
interval = 2

# What the screen shows: dial, twin, clock, minimal or image.
theme = dial

# Rotate through several screens instead of showing one. cycle lists each screen and
# its seconds, e.g. "dial 60, twin 30, clock 20". theme above is used when cycle_on is no.
cycle_on = no
cycle =

# Picture for the image theme. Leave blank until you choose one.
background =

# Picture behind the blades of the "fan_reveal" screen (Fan over a picture).
fan_picture =

# Picture boost for every picture screen, in per cent (50 to 250); 100 leaves them as taken.
picture_brightness = 100
picture_contrast = 100

# Zoom screen: up to five pictures, each written "x, y | picture path", where x and y are the
# point to zoom into as fractions (0 to 1) across and down. The control panel's Zoom tab
# writes these. zoom_seconds is each zoom (3 to 20), zoom_depth how many times it magnifies
# (2 to 12).
zoom_1 =
zoom_2 =
zoom_3 =
zoom_4 =
zoom_5 =
zoom_seconds = 8
zoom_depth = 6

# Fan screen: "video" plays smooth loops stored on the screen itself (uploaded once, about
# 2 MB); "stream" draws every frame on this PC and sends it (about 5 frames a second).
# The hamster and the glitch slideshow's changes follow this too.
fan_mode = video

# Slideshow screen: every picture in this folder in turn, each for slideshow_seconds.
# The glitch screen (Glitch slideshow) uses the same folder and time.
slideshow_folder =
slideshow_seconds = 10

# Playlist screen: up to five pictures, each written "seconds | picture path".
playlist_1 =
playlist_2 =
playlist_3 =
playlist_4 =
playlist_5 =

# Smart picture screen, first match wins: a running Steam game shows its artwork (yes or
# no); then an application rule, "process name | picture"; then the picture for the CPU
# temperature band (below the first edge, between, above the second); else rules_fallback.
rules_steam = yes
rules_app_1 =
rules_app_2 =
rules_app_3 =
rules_app_4 =
rules_app_5 =
rules_temp_edges = 50, 70
rules_temp_1 =
rules_temp_2 =
rules_temp_3 =
rules_fallback = dial

# Anti burn-in: move the picture by a couple of pixels every few minutes. yes or no.
pixel_shift = yes

# Anti burn-in: show the colour cycle until this local time, e.g. 2026-10-10T21:45:00.
# The control panel's Clear burn-in button sets it. Blank or past means off.
refresh_until =

# Anti burn-in: run the colour cycle every day at this time (HH:MM), for this many
# minutes, then go back to the normal screen. Blank time means no schedule.
refresh_daily_at =
refresh_daily_minutes = 60

# Set by the control panel's Stop button during a scheduled run: tonight's run ends,
# tomorrow's still happens.
refresh_skip_until =

# Anti burn-in: brightness (0 to 100) used only while a refresh runs; the normal
# brightness above comes back when it ends. Blank keeps the normal brightness.
refresh_brightness =

[colours]
# Colours changed from the default, as #rrggbb. The control panel's Colours tab writes
# these. Keys: background, track, text, muted, cool, warm, hot, load, gpu, download,
# upload, fan_cold, fan_hot, hub, hamster, wheel. Leave this section empty for the defaults.

[driver]
# The turing-smart-screen-python checkout that install.sh made.
upstream_dir = ~/.local/share/space-lcd/upstream
