<VirtualHost *:80>
    ServerName space-lcd
    DocumentRoot /var/www/html/space-lcd
    <Directory /var/www/html/space-lcd>
        Require all granted
        AllowOverride All
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/space-lcd-error.log
    CustomLog ${APACHE_LOG_DIR}/space-lcd-access.log combined
</VirtualHost>
